openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Weekly Mahjong session tracking
  - name: players
    description: Mahjong player roster
  - name: chip-scans
    description: Assisted Mahjong chip stack counting
  - name: telegram
    description: Telegram group chat integration
  - name: admin
    description: Admin roles and the signed-in user's own admin status
  - name: reservations
    description: Authenticated account reservations, separate from scored sessions and roster players
paths:
  /reservation-events:
    get:
      operationId: listReservationEvents
      tags: [reservations]
      summary: List events and their participant queues (sign-in required)
      description: Includes cancelled and started events. Ordered by startsAt then id. Account identifiers and emails are never included.
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationEvent"
        "401":
          $ref: "#/components/responses/ReservationUnauthorized"
    post:
      operationId: createReservationEvent
      tags: [reservations]
      summary: Create a future Mahjong event (any signed-in user)
      description: >-
        Date and HH:mm startTime are interpreted in Asia/Singapore (UTC+08:00).
        enrollCreator defaults false; true atomically books seat one. A successful
        reservation persists a pending creation notification, not a sent message.
        Idempotency-Key is a caller-generated UUID reused only for transport retries.
        Replays return the current event without applying the operation again.
      parameters:
        - $ref: "#/components/parameters/ReservationRequestKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationEventInput"
      responses:
        "201":
          $ref: "#/components/responses/ReservationEventResult"
        "400":
          $ref: "#/components/responses/ReservationInvalid"
        "401":
          $ref: "#/components/responses/ReservationUnauthorized"
        "409":
          $ref: "#/components/responses/ReservationConflict"
  /reservation-events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/ReservationEventId"
    get:
      operationId: getReservationEvent
      tags: [reservations]
      summary: Get an event and ordered participants (sign-in required)
      responses:
        "200":
          $ref: "#/components/responses/ReservationEventResult"
        "400":
          $ref: "#/components/responses/ReservationInvalid"
        "401":
          $ref: "#/components/responses/ReservationUnauthorized"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
    patch:
      operationId: updateReservationEvent
      tags: [reservations]
      summary: Change date and time before the original start (creator or admin)
      description: Both date and startTime are required. The old and new start must be in the future. Does not generate a notification.
      parameters:
        - $ref: "#/components/parameters/ReservationRequestKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationTimeInput"
      responses:
        "200":
          $ref: "#/components/responses/ReservationEventResult"
        "400":
          $ref: "#/components/responses/ReservationInvalid"
        "401":
          $ref: "#/components/responses/ReservationUnauthorized"
        "403":
          $ref: "#/components/responses/ReservationForbidden"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationConflict"
  /reservation-events/{eventId}/join:
    post:
      operationId: joinReservationEvent
      tags: [reservations]
      summary: Reserve the caller's own seat or append to the FIFO queue
      description: >-
        Four confirmed seats maximum. Server enrollment IDs determine FIFO order.
        Already enrolled callers are unchanged. No body or client account ID is accepted.
        At or after start, or after cancellation, fails without changing reservations.
        No notification is generated.
      parameters:
        - $ref: "#/components/parameters/ReservationEventId"
        - $ref: "#/components/parameters/ReservationRequestKey"
      responses:
        "200":
          $ref: "#/components/responses/ReservationEventResult"
        "400":
          $ref: "#/components/responses/ReservationInvalid"
        "401":
          $ref: "#/components/responses/ReservationUnauthorized"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationConflict"
  /reservation-events/{eventId}/leave:
    post:
      operationId: leaveReservationEvent
      tags: [reservations]
      summary: Leave the caller's own reservation and atomically promote the earliest waiter
      description: >-
        No body accepted. Leaving when not enrolled is a no-op. Leaving and then
        rejoining with a new request key appends a new queue entry. Promotions
        persist pending notification intents; ordinary departures do not.
        At or after start, or after cancellation, fails without changes.
      parameters:
        - $ref: "#/components/parameters/ReservationEventId"
        - $ref: "#/components/parameters/ReservationRequestKey"
      responses:
        "200":
          $ref: "#/components/responses/ReservationEventResult"
        "400":
          $ref: "#/components/responses/ReservationInvalid"
        "401":
          $ref: "#/components/responses/ReservationUnauthorized"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationConflict"
  /reservation-events/{eventId}/cancel:
    post:
      operationId: cancelReservationEvent
      tags: [reservations]
      summary: Persist cancellation (creator or admin)
      description: >-
        Allowed even after start. Repeated cancellation is a no-op. No body accepted.
        Preserves enrollment history, prevents all joins/leaves/promotions and
        persists one pending cancellation notification. Never deletes the event.
      parameters:
        - $ref: "#/components/parameters/ReservationEventId"
        - $ref: "#/components/parameters/ReservationRequestKey"
      responses:
        "200":
          $ref: "#/components/responses/ReservationEventResult"
        "400":
          $ref: "#/components/responses/ReservationInvalid"
        "401":
          $ref: "#/components/responses/ReservationUnauthorized"
        "403":
          $ref: "#/components/responses/ReservationForbidden"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationConflict"
  /reservation-events/{eventId}/notifications/{notificationId}/retry:
    post:
      operationId: retryReservationNotification
      tags: [reservations]
      summary: Requeue a failed notification (creator or admin); does not send it
      description: >-
        Failed to pending only. Pending, processing and sent intents cannot be retried.
        No body accepted. Does not modify membership or require Telegram configuration.
        Reservation success is independent of notification delivery. Only a delivery
        worker may mark sent after provider acknowledgement; sentAt stays null otherwise.
      parameters:
        - $ref: "#/components/parameters/ReservationEventId"
        - $ref: "#/components/parameters/ReservationNotificationId"
        - $ref: "#/components/parameters/ReservationRequestKey"
      responses:
        "200":
          $ref: "#/components/responses/ReservationEventResult"
        "400":
          $ref: "#/components/responses/ReservationInvalid"
        "401":
          $ref: "#/components/responses/ReservationUnauthorized"
        "403":
          $ref: "#/components/responses/ReservationForbidden"
        "404":
          $ref: "#/components/responses/ReservationNotFound"
        "409":
          $ref: "#/components/responses/ReservationConflict"
  /me:
    get:
      operationId: getCurrentUser
      tags: [admin]
      summary: Report the signed-in user's own admin status
      description: >-
        Signed-in users only, never gated by admin access itself. Reports
        isAdmin (ADMIN_EMAILS or the admins table) and isSuperAdmin
        (ADMIN_EMAILS only) for the caller.
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeStatus"
        "401":
          description: Unauthorized
  /admin/admins:
    get:
      operationId: listAdmins
      tags: [admin]
      summary: List granted admins
      description: >-
        Every admin in the admins table, plus every ADMIN_EMAILS entry shown
        read-only and flagged as coming from the environment. Any admin can
        view this list; only a super admin can grant or revoke.
      responses:
        "200":
          description: Admin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEntry"
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "500":
          description: Admin access is not configured
    post:
      operationId: grantAdmin
      tags: [admin]
      summary: Grant admin access to a signed-up user
      description: Super-admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantAdminInput"
      responses:
        "201":
          description: Admin granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntry"
        "400":
          description: Invalid email
        "401":
          description: Unauthorized
        "403":
          description: Admin access required (super admin only)
        "500":
          description: Admin access is not configured
  /admin/admins/{email}:
    delete:
      operationId: revokeAdmin
      tags: [admin]
      summary: Revoke a granted admin
      description: >-
        Super-admin only. Rejects attempts to revoke an ADMIN_EMAILS entry --
        those are env-only and can't be edited from the UI.
      parameters:
        - $ref: "#/components/parameters/AdminEmail"
      responses:
        "204":
          description: Admin revoked
        "400":
          description: That email is an ADMIN_EMAILS entry and can't be revoked from the UI
        "401":
          description: Unauthorized
        "403":
          description: Admin access required (super admin only)
        "404":
          description: No such granted admin
        "500":
          description: Admin access is not configured
  /admin/clerk-users:
    get:
      operationId: listClerkUsers
      tags: [admin]
      summary: List signed-up users for the admin grant picker
      description: >-
        Super-admin only. Lets the grant picker show real names instead of a
        typed email, so typos are impossible.
      responses:
        "200":
          description: Signed-up users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClerkUserSummary"
        "401":
          description: Unauthorized
        "403":
          description: Admin access required (super admin only)
        "500":
          description: Admin access is not configured
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List Mahjong sessions
      description: Returns shared Friday Mahjong sessions, newest first.
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MahjongSession"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Record a Mahjong session
      description: Adds a completed weekly Mahjong session to the shared history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MahjongSessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreationResponse"
        "400":
          description: Invalid session
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List Mahjong players
      description: Returns players with the number of sessions in which each player appears.
      parameters:
        - name: active
          in: query
          required: false
          description: When provided, limit results to active or inactive players.
          schema:
            type: boolean
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Add a player to the roster
      description: Creates an active player. Names are unique ignoring case and surrounding whitespace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid player
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "409":
          description: A player with that name already exists
  /players/{id}:
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Rename a player or change whether they are active
      description: >-
        A rename is reflected in every session, chart and leaderboard, since
        sessions reference players by id. Inactive players keep their full
        history but are not offered when recording a new session.
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid player update
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Player not found
        "409":
          description: Another player already has that name
  /sessions/summary:
    get:
      operationId: getSessionSummary
      tags: [sessions]
      summary: Get Mahjong scoreboard summary
      description: Returns lightweight totals, cumulative player winnings, nights each player finished in profit, Zha Hu counts, and 谢谢 Kai Xiang counts for the dashboard.
      responses:
        "200":
          description: Scoreboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get one Mahjong session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Mahjong session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MahjongSession"
        "404":
          description: Session not found
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a Mahjong session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MahjongSessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MahjongSession"
        "400":
          description: Invalid session
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Session not found
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a Mahjong session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session deleted
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Session not found
  /chip-scans/analyze:
    post:
      operationId: analyzeChipStacks
      tags: [chip-scans]
      summary: Analyze separated chip stacks
      description: Estimates quantities for the five configured Mahjong chip denominations from one temporary image. Admin review is required before applying the result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChipScanInput"
      responses:
        "200":
          description: Structured chip stack estimates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipScanResult"
        "400":
          description: Invalid image or analysis result
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "413":
          description: Image payload too large
        "422":
          description: Image does not show countable separated stacks
        "502":
          description: Image analysis service failed
  /telegram/broadcast:
    post:
      operationId: sendTelegramBroadcast
      tags: [telegram]
      summary: Broadcast an ad-hoc message to the group chat
      description: >-
        Posts arbitrary admin-composed text to the configured Telegram group
        chat, with no parse mode, so any characters send literally. This is
        also the manual retry path for a session announcement that failed to
        send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramBroadcastInput"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramBroadcastResult"
        "400":
          description: Invalid or over-length message
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "502":
          description: Telegram rejected or failed to deliver the message
        "503":
          description: Telegram is not configured
  /telegram/poll:
    post:
      operationId: startTelegramPoll
      tags: [telegram]
      summary: Start a Yes / No / Maybe attendance poll in the group chat
      description: >-
        Posts a native, non-anonymous Telegram poll with a preset question and
        Yes / No / Maybe options. Telegram shows the running tally and voter
        names directly in the chat, so poll results are never read back or
        stored by this application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramPollInput"
      responses:
        "200":
          description: Poll started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramPollResult"
        "400":
          description: Invalid preset
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "502":
          description: Telegram rejected or failed to start the poll
        "503":
          description: Telegram is not configured
  /telegram/webhook/info:
    get:
      operationId: getTelegramWebhookInfo
      tags: [telegram]
      summary: Show the Telegram webhook's registration status
      description: >-
        Compares the URL currently registered with Telegram against the
        server's own expected public URL, alongside pending update count and
        the last delivery error, if any.
      responses:
        "200":
          description: Webhook status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebhookInfo"
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "503":
          description: Telegram is not configured
  /telegram/webhook/register:
    post:
      operationId: registerTelegramWebhook
      tags: [telegram]
      summary: Register the Telegram webhook at a given URL
      description: >-
        Calls Telegram's setWebhook with the server-held secret and the
        supplied URL, then returns the freshly re-checked status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWebhookRegisterInput"
      responses:
        "200":
          description: Webhook registered; freshly re-checked status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebhookInfo"
        "400":
          description: URL is not a parseable https:// URL
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "500":
          description: TELEGRAM_WEBHOOK_SECRET is not configured
        "503":
          description: Telegram is not configured
components:
  responses:
    ReservationEventResult:
      description: Current event, caller-specific actions and actual notification delivery states
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReservationEvent"
    ReservationInvalid:
      description: Invalid input, request key, ID, Singapore date/time, or non-future start
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReservationError"
    ReservationUnauthorized:
      description: Sign-in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReservationError"
    ReservationForbidden:
      description: Only creator or existing admin may manage this event
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReservationError"
    ReservationNotFound:
      description: Event or notification not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReservationError"
    ReservationConflict:
      description: Started/cancelled event, non-retryable notification, or reused key with different operation/input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReservationError"
  parameters:
    ReservationEventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    ReservationNotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    ReservationRequestKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unique per account and logical operation; reuse unchanged for transport retries only
      schema:
        type: string
        format: uuid
    PlayerId:
      name: id
      in: path
      required: true
      description: Player identifier
      schema:
        type: integer
        format: int32
        minimum: 1
    SessionId:
      name: id
      in: path
      required: true
      description: Session identifier
      schema:
        type: integer
        format: int32
        minimum: 1
    AdminEmail:
      name: email
      in: path
      required: true
      description: Granted admin's email address (lowercased, trimmed)
      schema:
        type: string
  schemas:
    ReservationError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [UNAUTHORIZED, INVALID_INPUT, INVALID_TIME, START_NOT_FUTURE, EVENT_NOT_FOUND, NOTIFICATION_NOT_FOUND, MANAGER_REQUIRED, EVENT_STARTED, EVENT_CANCELLED, IDEMPOTENCY_CONFLICT, NOT_RETRYABLE]
    ReservationTimeInput:
      type: object
      additionalProperties: false
      required: [date, startTime]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Real Singapore calendar date, YYYY-MM-DD
        startTime:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
          description: Asia/Singapore local time, HH:mm in 24-hour format
    ReservationEventInput:
      type: object
      additionalProperties: false
      required: [date, startTime]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        enrollCreator:
          type: boolean
          default: false
    ReservationParticipant:
      type: object
      required: [enrollmentId, displayName, isCaller, joinedAt]
      properties:
        enrollmentId:
          type: integer
        displayName:
          type: string
          description: Safe display name snapshot; never an email or account ID
        isCaller:
          type: boolean
        joinedAt:
          type: string
          format: date-time
    ReservationConfirmedParticipant:
      allOf:
        - $ref: "#/components/schemas/ReservationParticipant"
        - type: object
          required: [seat]
          properties:
            seat:
              type: integer
              minimum: 1
              maximum: 4
    ReservationWaitingParticipant:
      allOf:
        - $ref: "#/components/schemas/ReservationParticipant"
        - type: object
          required: [position]
          properties:
            position:
              type: integer
              minimum: 1
              description: One-based active FIFO position; recalculated after departures
    ReservationNotification:
      type: object
      required: [id, kind, status, attempts, createdAt, sentAt, failureCode, canRetry]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [created, promoted, cancelled]
        status:
          type: string
          enum: [pending, processing, sent, failed]
          description: Pending is durable but not delivered; sent requires provider acknowledgement
        attempts:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: [string, "null"]
          format: date-time
        failureCode:
          type: [string, "null"]
          enum: [DELIVERY_FAILED, null]
        canRetry:
          type: boolean
    ReservationEvent:
      type: object
      required: [id, date, startTime, timeZone, startsAt, createdAt, cancelledAt, status, capacity, creator, confirmed, waiting, callerState, allowedActions, notifications]
      properties:
        id:
          type: integer
        date:
          type: string
        startTime:
          type: string
        timeZone:
          type: string
          enum: [Asia/Singapore]
        startsAt:
          type: string
          format: date-time
          description: Unambiguous UTC instant, corresponding to date/startTime in Asia/Singapore
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [open, started, cancelled]
        capacity:
          type: integer
          enum: [4]
        creator:
          type: object
          required: [displayName, isCaller]
          properties:
            displayName:
              type: string
            isCaller:
              type: boolean
        confirmed:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ReservationConfirmedParticipant"
        waiting:
          type: array
          items:
            $ref: "#/components/schemas/ReservationWaitingParticipant"
        callerState:
          type: string
          enum: [none, confirmed, waiting]
        allowedActions:
          type: object
          required: [join, leave, edit, cancel, retryNotification]
          properties:
            join:
              type: boolean
            leave:
              type: boolean
            edit:
              type: boolean
            cancel:
              type: boolean
            retryNotification:
              type: boolean
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/ReservationNotification"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MahjongSession:
      type: object
      properties:
        id:
          type: integer
          format: int32
        playedOn:
          type: string
          format: date
        rounds:
          type: integer
          format: int32
          minimum: 1
        basePot:
          $ref: "#/components/schemas/BasePot"
        playerBalances:
          type: array
          items:
            $ref: "#/components/schemas/PlayerBalance"
        notes:
          type: ["string", "null"]
        createdByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - playedOn
        - rounds
        - basePot
        - playerBalances
        - notes
        - createdByUserId
        - createdAt
    SessionCreationResponse:
      allOf:
        - $ref: "#/components/schemas/MahjongSession"
        - type: object
          properties:
            announcement:
              $ref: "#/components/schemas/TelegramAnnouncementOutcome"
          required:
            - announcement
    TelegramAnnouncementOutcome:
      oneOf:
        - type: object
          properties:
            status:
              type: string
              enum: [sent]
            messageId:
              type: ["integer", "null"]
          required:
            - status
            - messageId
        - type: object
          properties:
            status:
              type: string
              enum: [skipped]
            reason:
              type: string
              enum: [not_configured]
          required:
            - status
            - reason
        - type: object
          properties:
            status:
              type: string
              enum: [failed]
            reason:
              type: string
              enum: [delivery_failed]
          required:
            - status
            - reason
    TelegramBroadcastInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Sent verbatim to the group chat with no parse mode, so brackets,
            asterisks, and emoji are never treated as formatting.
      required:
        - message
    TelegramBroadcastResult:
      type: object
      properties:
        status:
          type: string
          enum: [sent]
        messageId:
          type: ["integer", "null"]
      required:
        - status
        - messageId
    TelegramPollInput:
      type: object
      properties:
        preset:
          type: string
          enum: [tonight, this_friday]
          description: >-
            Which preset question to post. The question text itself is
            composed server-side so the group always sees a consistent
            phrasing.
      required:
        - preset
    TelegramPollResult:
      type: object
      properties:
        status:
          type: string
          enum: [sent]
        messageId:
          type: ["integer", "null"]
      required:
        - status
        - messageId
    TelegramWebhookInfo:
      type: object
      properties:
        status:
          type: string
          enum: [ok, mismatch, unregistered]
          description: >-
            "ok" when the registered URL matches the server's expected URL,
            "mismatch" when a different URL is registered, "unregistered"
            when nothing is registered with Telegram at all.
        registeredUrl:
          type: string
          description: The URL currently registered with Telegram, or empty if none.
        expectedUrl:
          type: string
          description: >-
            The URL the server derives for itself from PUBLIC_URL, or the
            request's own forwarded origin.
        pendingUpdateCount:
          type: integer
        lastErrorMessage:
          type: ["string", "null"]
        lastErrorDate:
          type: ["integer", "null"]
      required:
        - status
        - registeredUrl
        - expectedUrl
        - pendingUpdateCount
        - lastErrorMessage
        - lastErrorDate
    TelegramWebhookRegisterInput:
      type: object
      properties:
        url:
          type: string
          description: >-
            The webhook URL to register with Telegram. Pre-filled by the
            client with the server's expected URL, but editable so an odd
            setup (custom domain, tunnel) still has an escape hatch.
      required:
        - url
    MeStatus:
      type: object
      properties:
        isAdmin:
          type: boolean
        isSuperAdmin:
          type: boolean
      required:
        - isAdmin
        - isSuperAdmin
    AdminEntry:
      type: object
      properties:
        email:
          type: string
        source:
          type: string
          enum: [env, table]
          description: >-
            "env" entries come from ADMIN_EMAILS and are read-only in the UI;
            "table" entries were granted through the admin list card.
        grantedBy:
          type: ["string", "null"]
          description: Email of the super admin who granted this. Null for "env" entries.
        grantedAt:
          type: ["string", "null"]
          format: date-time
          description: Null for "env" entries.
      required:
        - email
        - source
        - grantedBy
        - grantedAt
    GrantAdminInput:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          description: Primary email of a signed-up user, from the Clerk user picker.
      required:
        - email
    ClerkUserSummary:
      type: object
      properties:
        id:
          type: string
          description: Clerk user ID.
        email:
          type: string
          description: Primary email address.
        name:
          type: ["string", "null"]
          description: Full name, if the user has set one.
      required:
        - id
        - email
        - name
    MahjongSessionInput:
      type: object
      properties:
        playedOn:
          type: string
          format: date
        rounds:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        basePot:
          $ref: "#/components/schemas/BasePot"
        playerBalances:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/PlayerBalance"
        notes:
          type: ["string", "null"]
          maxLength: 500
      required:
        - playedOn
        - rounds
        - basePot
        - playerBalances
    MahjongSessionUpdate:
      type: object
      properties:
        playedOn:
          type: string
          format: date
        rounds:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        basePot:
          $ref: "#/components/schemas/BasePot"
        playerBalances:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/PlayerBalance"
        notes:
          type: ["string", "null"]
          maxLength: 500
    BasePot:
      type: integer
      format: int32
      minimum: 1
      description: >-
        Whole dollars the session was played for across all four players.
        Must divide evenly by four, and the four ending amounts must sum to it
        exactly (enforced by the server beyond this schema).
    PlayerBalance:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
          minimum: 1
          description: The player in this seat. Resolve the name from the player record.
        endingAmount:
          type: integer
          format: int32
          minimum: 0
          description: Whole dollars the player finished the session with.
        zhaHuCount:
          type: integer
          format: int32
          minimum: 0
        xieXieKaiXiangCount:
          type: integer
          format: int32
          minimum: 0
      required:
        - playerId
        - endingAmount
        - zhaHuCount
        - xieXieKaiXiangCount
    PlayerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - name
    PlayerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
    Player:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
        sessionCount:
          type: integer
          format: int32
          minimum: 0
        createdByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - active
        - sessionCount
        - createdByUserId
        - createdAt
    ChipDenomination:
      type: string
      enum:
        - white
        - orange
        - light_blue
        - blue
        - black
    ChipScanInput:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 16
          maxLength: 6000000
          description: Base64-encoded image bytes without a data URL prefix.
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
      required:
        - imageBase64
        - mimeType
    ChipStackEstimate:
      type: object
      properties:
        denomination:
          $ref: "#/components/schemas/ChipDenomination"
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        uncertainty:
          type: ["string", "null"]
          maxLength: 240
      required:
        - denomination
        - count
        - confidence
        - uncertainty
    ChipScanResult:
      type: object
      properties:
        stacks:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/ChipStackEstimate"
        overallConfidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
