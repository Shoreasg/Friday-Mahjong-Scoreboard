openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Weekly Mahjong session tracking
  - name: players
    description: Mahjong player roster
  - name: chip-scans
    description: Assisted Mahjong chip stack counting
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List Mahjong sessions
      description: Returns shared Friday Mahjong sessions, newest first.
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MahjongSession"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Record a Mahjong session
      description: Adds a completed weekly Mahjong session to the shared history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MahjongSessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MahjongSession"
        "400":
          description: Invalid session
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List Mahjong players
      description: Returns players with the number of sessions in which each player appears.
      parameters:
        - name: active
          in: query
          required: false
          description: When provided, limit results to active or inactive players.
          schema:
            type: boolean
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /sessions/summary:
    get:
      operationId: getSessionSummary
      tags: [sessions]
      summary: Get Mahjong scoreboard summary
      description: Returns lightweight totals, cumulative player winnings, winner counts, Zha Hu counts, and 谢谢 Kai Xiang counts for the dashboard.
      responses:
        "200":
          description: Scoreboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get one Mahjong session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Mahjong session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MahjongSession"
        "404":
          description: Session not found
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a Mahjong session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MahjongSessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MahjongSession"
        "400":
          description: Invalid session
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Session not found
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a Mahjong session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session deleted
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Session not found
  /chip-scans/analyze:
    post:
      operationId: analyzeChipStacks
      tags: [chip-scans]
      summary: Analyze separated chip stacks
      description: Estimates quantities for the five configured Mahjong chip denominations from one temporary image. Admin review is required before applying the result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChipScanInput"
      responses:
        "200":
          description: Structured chip stack estimates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipScanResult"
        "400":
          description: Invalid image or analysis result
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "413":
          description: Image payload too large
        "422":
          description: Image does not show countable separated stacks
        "502":
          description: Image analysis service failed
components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Session identifier
      schema:
        type: integer
        format: int32
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MahjongSession:
      type: object
      properties:
        id:
          type: integer
          format: int32
        playedOn:
          type: string
          format: date
        rounds:
          type: integer
          format: int32
          minimum: 1
        totalAmount:
          type: number
          format: double
        winnerName:
          type: string
        playerBalances:
          type: array
          items:
            $ref: "#/components/schemas/PlayerBalance"
        notes:
          type: ["string", "null"]
        createdByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - playedOn
        - rounds
        - totalAmount
        - winnerName
        - playerBalances
        - notes
        - createdByUserId
        - createdAt
    MahjongSessionInput:
      type: object
      properties:
        playedOn:
          type: string
          format: date
        rounds:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        playerBalances:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/PlayerBalance"
        notes:
          type: ["string", "null"]
          maxLength: 500
      required:
        - playedOn
        - rounds
        - playerBalances
    MahjongSessionUpdate:
      type: object
      properties:
        playedOn:
          type: string
          format: date
        rounds:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        playerBalances:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/PlayerBalance"
        notes:
          type: ["string", "null"]
          maxLength: 500
    PlayerBalance:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        endingAmount:
          type: number
          format: double
          minimum: 0
        zhaHuCount:
          type: integer
          format: int32
          minimum: 0
        xieXieKaiXiangCount:
          type: integer
          format: int32
          minimum: 0
      required:
        - name
        - endingAmount
        - zhaHuCount
        - xieXieKaiXiangCount
    Player:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
        sessionCount:
          type: integer
          format: int32
          minimum: 0
        createdByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - active
        - sessionCount
        - createdByUserId
        - createdAt
    ChipDenomination:
      type: string
      enum:
        - white
        - orange
        - light_blue
        - blue
        - black
    ChipScanInput:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 16
          maxLength: 6000000
          description: Base64-encoded image bytes without a data URL prefix.
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
      required:
        - imageBase64
        - mimeType
    ChipStackEstimate:
      type: object
      properties:
        denomination:
          $ref: "#/components/schemas/ChipDenomination"
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        uncertainty:
          type: ["string", "null"]
          maxLength: 240
      required:
        - denomination
        - count
        - confidence
        - uncertainty
    ChipScanResult:
      type: object
      properties:
        stacks:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/ChipStackEstimate"
        overallConfidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        guidance:
          type: ["string", "null"]
          maxLength: 300
      required:
        - stacks
        - overallConfidence
        - guidance
    WinnerCount:
      type: object
      properties:
        winnerName:
          type: string
        wins:
          type: integer
          format: int32
      required:
        - winnerName
        - wins
    ZhaHuCount:
      type: object
      properties:
        playerName:
          type: string
        count:
          type: integer
          format: int32
          minimum: 0
      required:
        - playerName
        - count
    XieXieKaiXiangCount:
      type: object
      properties:
        playerName:
          type: string
        count:
          type: integer
          format: int32
          minimum: 0
      required:
        - playerName
        - count
    PlayerWinnings:
      type: object
      properties:
        playerName:
          type: string
        netAmount:
          type: number
          format: double
      required:
        - playerName
        - netAmount
    SessionSummary:
      type: object
      properties:
        totalSessions:
          type: integer
          format: int32
        totalRounds:
          type: integer
          format: int32
        totalAmount:
          type: number
          format: double
        latestSession:
          anyOf:
            - $ref: "#/components/schemas/MahjongSession"
            - type: "null"
        winnerCounts:
          type: array
          items:
            $ref: "#/components/schemas/WinnerCount"
        zhaHuCounts:
          type: array
          items:
            $ref: "#/components/schemas/ZhaHuCount"
        xieXieKaiXiangCounts:
          type: array
          items:
            $ref: "#/components/schemas/XieXieKaiXiangCount"
        playerWinnings:
          type: array
          items:
            $ref: "#/components/schemas/PlayerWinnings"
      required:
        - totalSessions
        - totalRounds
        - totalAmount
        - latestSession
        - winnerCounts
        - zhaHuCounts
        - xieXieKaiXiangCounts
        - playerWinnings

