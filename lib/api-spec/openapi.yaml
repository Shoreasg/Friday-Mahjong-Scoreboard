        - playerId
        - playerName
        - nights
    ZhaHuCount:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        playerName:
          type: string
        count:
          type: integer
          format: int32
          minimum: 0
      required:
        - playerId
        - playerName
        - count
    XieXieKaiXiangCount:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        playerName:
          type: string
        count:
          type: integer
          format: int32
          minimum: 0
      required:
        - playerId
        - playerName
        - count
    PlayerWinnings:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        playerName:
          type: string
        netAmount:
          type: number
          format: double
      required:
        - playerId
        - playerName
        - netAmount
    SessionSummary:
      type: object
      properties:
        totalSessions:
          type: integer
          format: int32
        totalRounds:
          type: integer
          format: int32
        latestSession:
          anyOf:
            - $ref: "#/components/schemas/MahjongSession"
            - type: "null"
        profitNightCounts:
          type: array
          items:
            $ref: "#/components/schemas/ProfitNightCount"
        zhaHuCounts:
          type: array
          items:
            $ref: "#/components/schemas/ZhaHuCount"
        xieXieKaiXiangCounts:
          type: array
          items:
            $ref: "#/components/schemas/XieXieKaiXiangCount"
        playerWinnings:
          type: array
          items:
            $ref: "#/components/schemas/PlayerWinnings"
      required:
