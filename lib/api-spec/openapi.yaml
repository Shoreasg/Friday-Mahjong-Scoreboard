openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Weekly Mahjong session tracking
  - name: players
    description: Mahjong player roster
  - name: chip-scans
    description: Assisted Mahjong chip stack counting
  - name: telegram
    description: Telegram group chat integration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List Mahjong sessions
      description: Returns shared Friday Mahjong sessions, newest first.
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MahjongSession"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Record a Mahjong session
      description: Adds a completed weekly Mahjong session to the shared history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MahjongSessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreationResponse"
        "400":
          description: Invalid session
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List Mahjong players
      description: Returns players with the number of sessions in which each player appears.
      parameters:
        - name: active
          in: query
          required: false
          description: When provided, limit results to active or inactive players.
          schema:
            type: boolean
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Add a player to the roster
      description: Creates an active player. Names are unique ignoring case and surrounding whitespace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid player
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "409":
          description: A player with that name already exists
  /players/{id}:
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Rename a player or change whether they are active
      description: >-
        A rename is reflected in every session, chart and leaderboard, since
        sessions reference players by id. Inactive players keep their full
        history but are not offered when recording a new session.
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid player update
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Player not found
        "409":
          description: Another player already has that name
  /sessions/summary:
    get:
      operationId: getSessionSummary
      tags: [sessions]
      summary: Get Mahjong scoreboard summary
      description: Returns lightweight totals, cumulative player winnings, nights each player finished in profit, Zha Hu counts, and 谢谢 Kai Xiang counts for the dashboard.
      responses:
        "200":
          description: Scoreboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get one Mahjong session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Mahjong session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MahjongSession"
        "404":
          description: Session not found
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a Mahjong session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MahjongSessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MahjongSession"
        "400":
          description: Invalid session
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Session not found
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a Mahjong session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session deleted
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Session not found
  /chip-scans/analyze:
    post:
      operationId: analyzeChipStacks
      tags: [chip-scans]
      summary: Analyze separated chip stacks
      description: Estimates quantities for the five configured Mahjong chip denominations from one temporary image. Admin review is required before applying the result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChipScanInput"
      responses:
        "200":
          description: Structured chip stack estimates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChipScanResult"
        "400":
          description: Invalid image or analysis result
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "413":
          description: Image payload too large
        "422":
          description: Image does not show countable separated stacks
        "502":
          description: Image analysis service failed
  /telegram/broadcast:
    post:
      operationId: sendTelegramBroadcast
      tags: [telegram]
      summary: Broadcast an ad-hoc message to the group chat
      description: >-
        Posts arbitrary admin-composed text to the configured Telegram group
        chat, with no parse mode, so any characters send literally. This is
        also the manual retry path for a session announcement that failed to
        send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramBroadcastInput"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramBroadcastResult"
        "400":
          description: Invalid or over-length message
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "502":
          description: Telegram rejected or failed to deliver the message
        "503":
          description: Telegram is not configured
components:
  parameters:
    PlayerId:
      name: id
      in: path
      required: true
      description: Player identifier
      schema:
        type: integer
        format: int32
        minimum: 1
    SessionId:
      name: id
      in: path
      required: true
      description: Session identifier
      schema:
        type: integer
        format: int32
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MahjongSession:
      type: object
      properties:
        id:
          type: integer
          format: int32
        playedOn:
          type: string
          format: date
        rounds:
          type: integer
          format: int32
          minimum: 1
        basePot:
          $ref: "#/components/schemas/BasePot"
        playerBalances:
          type: array
          items:
            $ref: "#/components/schemas/PlayerBalance"
        notes:
          type: ["string", "null"]
        createdByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - playedOn
        - rounds
        - basePot
        - playerBalances
        - notes
        - createdByUserId
        - createdAt
    SessionCreationResponse:
      allOf:
        - $ref: "#/components/schemas/MahjongSession"
        - type: object
          properties:
            announcement:
              $ref: "#/components/schemas/TelegramAnnouncementOutcome"
          required:
            - announcement
    TelegramAnnouncementOutcome:
      oneOf:
        - type: object
          properties:
            status:
              type: string
              enum: [sent]
            messageId:
              type: ["integer", "null"]
          required:
            - status
            - messageId
        - type: object
          properties:
            status:
              type: string
              enum: [skipped]
            reason:
              type: string
              enum: [not_configured]
          required:
            - status
            - reason
        - type: object
          properties:
            status:
              type: string
              enum: [failed]
            reason:
              type: string
              enum: [delivery_failed]
          required:
            - status
            - reason
    TelegramBroadcastInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Sent verbatim to the group chat with no parse mode, so brackets,
            asterisks, and emoji are never treated as formatting.
      required:
        - message
    TelegramBroadcastResult:
      type: object
      properties:
        status:
          type: string
          enum: [sent]
        messageId:
          type: ["integer", "null"]
      required:
        - status
        - messageId
    MahjongSessionInput:
      type: object
      properties:
        playedOn:
          type: string
          format: date
        rounds:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        basePot:
          $ref: "#/components/schemas/BasePot"
        playerBalances:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/PlayerBalance"
        notes:
          type: ["string", "null"]
          maxLength: 500
      required:
        - playedOn
        - rounds
        - basePot
        - playerBalances
    MahjongSessionUpdate:
      type: object
      properties:
        playedOn:
          type: string
          format: date
        rounds:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        basePot:
          $ref: "#/components/schemas/BasePot"
        playerBalances:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/PlayerBalance"
        notes:
          type: ["string", "null"]
          maxLength: 500
    BasePot:
      type: integer
      format: int32
      minimum: 1
      description: >-
        Whole dollars the session was played for across all four players.
        Must divide evenly by four, and the four ending amounts must sum to it
        exactly (enforced by the server beyond this schema).
    PlayerBalance:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
          minimum: 1
          description: The player in this seat. Resolve the name from the player record.
        endingAmount:
          type: integer
          format: int32
          minimum: 0
          description: Whole dollars the player finished the session with.
        zhaHuCount:
          type: integer
          format: int32
          minimum: 0
        xieXieKaiXiangCount:
          type: integer
          format: int32
          minimum: 0
      required:
        - playerId
        - endingAmount
        - zhaHuCount
        - xieXieKaiXiangCount
    PlayerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - name
    PlayerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
    Player:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
        sessionCount:
          type: integer
          format: int32
          minimum: 0
        createdByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - active
        - sessionCount
        - createdByUserId
        - createdAt
    ChipDenomination:
      type: string
      enum:
        - white
        - orange
        - light_blue
        - blue
        - black
    ChipScanInput:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 16
          maxLength: 6000000
          description: Base64-encoded image bytes without a data URL prefix.
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
      required:
        - imageBase64
        - mimeType
    ChipStackEstimate:
      type: object
      properties:
        denomination:
          $ref: "#/components/schemas/ChipDenomination"
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        uncertainty:
          type: ["string", "null"]
          maxLength: 240
      required:
        - denomination
        - count
        - confidence
        - uncertainty
    ChipScanResult:
      type: object
      properties:
        stacks:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/ChipStackEstimate"
        overallConfidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        guidance:
          type: ["string", "null"]
          maxLength: 300
      required:
        - stacks
        - overallConfidence
        - guidance
    ProfitNightCount:
      type: object
      description: How many nights a player finished strictly above their per-player share.
      properties:
        playerId:
          type: integer
          format: int32
        playerName:
          type: string
        nights:
          type: integer
          format: int32
          minimum: 1
      required:
        - playerId
        - playerName
        - nights
    ZhaHuCount:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        playerName:
          type: string
        count:
          type: integer
          format: int32
          minimum: 0
      required:
        - playerId
        - playerName
        - count
    XieXieKaiXiangCount:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        playerName:
          type: string
        count:
          type: integer
          format: int32
          minimum: 0
      required:
        - playerId
        - playerName
        - count
    PlayerWinnings:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        playerName:
          type: string
        netAmount:
          type: number
          format: double
      required:
        - playerId
        - playerName
        - netAmount
    SessionSummary:
      type: object
      properties:
        totalSessions:
          type: integer
          format: int32
        totalRounds:
          type: integer
          format: int32
        latestSession:
          anyOf:
            - $ref: "#/components/schemas/MahjongSession"
            - type: "null"
        profitNightCounts:
          type: array
          items:
            $ref: "#/components/schemas/ProfitNightCount"
        zhaHuCounts:
          type: array
          items:
            $ref: "#/components/schemas/ZhaHuCount"
        xieXieKaiXiangCounts:
          type: array
          items:
            $ref: "#/components/schemas/XieXieKaiXiangCount"
        playerWinnings:
          type: array
          items:
            $ref: "#/components/schemas/PlayerWinnings"
      required:
        - totalSessions
        - totalRounds
        - latestSession
        - profitNightCounts
        - zhaHuCounts
        - xieXieKaiXiangCounts
        - playerWinnings

